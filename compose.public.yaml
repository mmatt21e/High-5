x-public-origin: &public-origin
  AUTH_URL: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in deploy/docker.env}

services:
  migrate:
    environment: *public-origin

  app:
    environment: *public-origin

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in deploy/docker.env}
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - -T
        - "3"
        - http://127.0.0.1:8080/api/health
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

volumes:
  caddy-data:
    name: ${COMPOSE_PROJECT_NAME:-five-o-poker}-caddy-data
  caddy-config:
    name: ${COMPOSE_PROJECT_NAME:-five-o-poker}-caddy-config
